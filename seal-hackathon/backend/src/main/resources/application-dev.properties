# === Local SQL Server connection ===
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SEAL_Hackathon_G06;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# === Database schema policy ===
# Local development uses the shared SQL scripts in /database only.
# After pulling schema changes, rerun seal_hackathon.sql then seed_test_data.sql.
spring.jpa.hibernate.ddl-auto=none

# === Local demo data importer ===
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.script-root=${DEMO_SCRIPT_ROOT:../database/demo}
app.demo.zone-id=${DEMO_ZONE_ID:Asia/Ho_Chi_Minh}
